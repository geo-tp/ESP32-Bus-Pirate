<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="title desc">
  <title id="title">Terminal shell visual</title>
  <desc id="desc">No-text reusable terminal shell illustration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#1a1a1a"/><stop offset="1" stop-color="#0f0f0f"/></linearGradient>
    <radialGradient id="cyanGlow" cx="15%" cy="18%" r="60%"><stop offset="0" stop-color="#00ffcc" stop-opacity=".12"/><stop offset="1" stop-color="#00ffcc" stop-opacity="0"/></radialGradient>
    <radialGradient id="greenGlow" cx="86%" cy="82%" r="65%"><stop offset="0" stop-color="#00ff70" stop-opacity=".10"/><stop offset="1" stop-color="#00ff70" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1040" height="600" rx="18" fill="url(#bg)"/>
  <rect width="1040" height="600" rx="18" fill="url(#cyanGlow)"/>
  <rect width="1040" height="600" rx="18" fill="url(#greenGlow)"/>
  <g stroke="#22312d" stroke-width="1.4" opacity=".72">
    <path d="M70 470h900M70 390h900M70 310h900M70 230h900M70 150h900"/>
    <path d="M170 72v456M330 72v456M490 72v456M650 72v456M810 72v456"/>
    <path d="M-50 540L520 40M160 575L790 35M500 620L1070 120" opacity=".28"/>
  </g>
  <rect x="150" y="105" width="740" height="390" rx="24" fill="#101615" stroke="#40514b" stroke-width="2" opacity="1"/><circle cx="195" cy="148" r="8" fill="#00ffcc" opacity="1"/><circle cx="225" cy="148" r="8" fill="#00ff70" opacity="1"/><circle cx="255" cy="148" r="8" fill="#ffc257" opacity="1"/><path d="M205 215 L780 215" fill="none" stroke="#00ffcc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><path d="M205 253 L670 253" fill="none" stroke="#00ff70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><path d="M205 291 L560 291" fill="none" stroke="#34b0ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><path d="M205 329 L780 329" fill="none" stroke="#ffc257" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><path d="M205 367 L670 367" fill="none" stroke="#00ffcc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><path d="M205 405 L560 405" fill="none" stroke="#00ff70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><circle cx="205" cy="215" r="6" fill="#00ffcc" opacity="1" filter="url(#glow)"/>
</svg>