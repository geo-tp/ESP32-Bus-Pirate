<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="title desc">
  <title id="title">iButton visual</title>
  <desc id="desc">No-text reusable iButton illustration.</desc>
  <defs>
