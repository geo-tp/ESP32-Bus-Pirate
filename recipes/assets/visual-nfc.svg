<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="title desc">
  <title id="title">NFC visual</title>
  <desc id="desc">No-text reusable NFC illustration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#1a1a1a"/><stop offset="1" stop-color="#0f0f0f"/></linearGradient>
    <radialGradient id="cyanGlow" cx="15%" cy="18%" r="60%"><stop offset="0" stop-color="#00ffcc" stop-opacity=".12"/><stop offset="1" stop-color="#00ffcc" stop-opacity="0"/></radialGradient>
    <radialGradient id="greenGlow" cx="86%" cy="82%" r="65%"><stop offset="0" stop-color="#00ff70" stop-opacity=".10"/><stop offset="1" stop-color="#00ff70" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1040" height="600" rx="18" fill="url(#bg)"/>
  <rect width="1040" height="600" rx="18" fill="url(#cyanGlow)"/>
  <rect width="1040" height="600" rx="18" fill="url(#greenGlow)"/>
