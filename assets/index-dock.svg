<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="title desc">
  <title id="title">Square ESP32-S3 dock visual</title>
  <desc id="desc">Square carrier board with ESP32-S3 socket, headers, connectors, traces and mounting holes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0f0f0f"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="16%" cy="20%" r="64%">
      <stop offset="0" stop-color="#00ffcc" stop-opacity=".13"/>
      <stop offset="1" stop-color="#00ffcc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="88%" cy="82%" r="65%">
      <stop offset="0" stop-color="#00ff70" stop-opacity=".10"/>
      <stop offset="1" stop-color="#00ff70" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="board" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#13201d"/>
      <stop offset="1" stop-color="#0d1513"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111816"/>
      <stop offset="1" stop-color="#080c0b"/>
    </linearGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1040" height="600" rx="18" fill="url(#bg)"/>
  <rect width="1040" height="600" rx="18" fill="url(#cyanGlow)"/>
  <rect width="1040" height="600" rx="18" fill="url(#greenGlow)"/>

