  <rect x="160" y="366" width="220" height="48" rx="12" fill="#1b4430" stroke="#00ffcc" stroke-width="2"/>
  <text x="197" y="397" fill="#d8fff2" font-family="Menlo, Courier New, monospace" font-size="18" font-weight="700">FLASH DEVICE</text>
  <rect x="560" y="196" width="310" height="238" rx="20" fill="#101615" stroke="#335149" stroke-width="2"/>
  <text x="596" y="240" fill="#b8ffb8" font-family="Menlo, Courier New, monospace" font-size="18" font-weight="700">Ready to install</text>
