<body>
<main class="app-shell">
<noscript>
<section class="compatibility-banner">
<h2>JavaScript is required</h2>
<p>This browser serial terminal needs JavaScript and Web Serial support. You can still visit the <a href="../">ESP32 Bit Pirate web tools</a>, the <a href="https://github.com/geo-tp/ESP32-Bit-Pirate">ESP32 Bit Pirate repository</a>, or the <a href="https://github.com/geo-tp/ESP32-Bit-Pirate/wiki">documentation</a>.</p>
</section>
</noscript>
<section class="compatibility-banner" hidden="" id="compatibilityBanner">
<h2>Web Serial is not available in this browser</h2>
<p>Use Chrome 89+, Edge 89+, Firefox 151+ on desktop, Opera, or another compatible Chromium browser over HTTPS or localhost. Safari is not currently supported.</p>
</section>
<section aria-label="Web Serial terminal tool" class="tool-card">
<div aria-label="Serial connection controls" class="toolbar">
<div aria-label="Web Serial Terminal" class="toolbar-brand">
<a aria-label="ESP32 Bit Pirate home" class="brand-mark" href="../">B</a>
<a class="tool-home-link" href="../">Web Serial Terminal</a>
<div aria-label="Terminal appearance" class="terminal-controls">
<button aria-label="Decrease terminal text size" id="fontDecreaseButton" type="button">-</button>
<select aria-label="Terminal color theme" id="themeSelect">
<option selected="" value="soft">Soft</option>
<option value="green">Green</option>
<option value="contrast">Contrast</option>
</select>
<button aria-label="Increase terminal text size" id="fontIncreaseButton" type="button">+</button>
</div>
<span class="config-status-group">
<button aria-controls="configPanel" aria-expanded="false" aria-label="Serial settings" class="config-button" id="configButton" title="Serial settings" type="button">⚙</button>
<span aria-live="polite" class="connection-status" id="connectionStatus">Ready</span>
</span>
</div>
<div class="toolbar-actions">
<button class="primary" id="connectButton" type="button">Connect</button>
<button id="clearButton" type="button">Clear</button>
<button disabled="" id="downloadButton" title="No serial log to download" type="button">Download log</button>
</div>
</div>
<section aria-label="Serial terminal" class="terminal-panel">
<div class="terminal-surface" id="terminal"></div>
</section>
</section>
</main>
<div class="modal-overlay" hidden="" id="configOverlay"></div>
<section aria-labelledby="configTitle" aria-modal="true" class="config-panel" hidden="" id="configPanel" role="dialog">
<header class="config-header">
<h2 id="configTitle">Serial Settings</h2>
<button aria-label="Close serial settings" id="configCloseButton" type="button">×</button>
</header>
<div class="config-grid">
<label>
<span>Baud</span>
<input id="baudRateInput" inputmode="numeric" min="1" step="1" type="number" value="115200"/>
</label>
<label>
<span>Data bits</span>
<select id="dataBitsSelect">
<option selected="" value="8">8</option>
<option value="7">7</option>
</select>
</label>
<label>
<span>Stop bits</span>
<select id="stopBitsSelect">
<option selected="" value="1">1</option>
<option value="2">2</option>
</select>
</label>
<label>
<span>Parity</span>
<select id="paritySelect">
<option selected="" value="none">None</option>
<option value="even">Even</option>
<option value="odd">Odd</option>
</select>
</label>
<label>
<span>Flow control</span>
<select id="flowControlSelect">
<option selected="" value="none">None</option>
<option value="hardware">Hardware</option>
</select>
</label>
<label>
<span>Enter key</span>
<select id="enterModeSelect">
<option selected="" value="cr">CR</option>
<option value="lf">LF</option>
<option value="crlf">CRLF</option>
</select>
</label>
</div>
<label class="config-check">
<input id="localEchoCheckbox" type="checkbox"/>
<span>Local echo</span>
</label>
<label class="config-check disabled">
<input disabled="" id="invertSignalCheckbox" type="checkbox"/>
<span>Inverted UART is not supported by browser Web Serial.</span>
</label>
</section>
