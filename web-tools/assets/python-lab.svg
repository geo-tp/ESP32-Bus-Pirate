<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-labelledby="title desc">
  <title id="title">Python Lab desktop-style browser interface</title>
  <desc id="desc">A compact preview of a browser Python lab with an editor, Web Serial bridge and Bit Pirate console output.</desc>
  <rect width="520" height="300" rx="8" fill="#0b0d0c"/>
  <rect x="16" y="16" width="488" height="268" rx="8" fill="#121615" stroke="#333"/>
  <rect x="16" y="16" width="488" height="42" rx="8" fill="#101412" stroke="#333"/>
  <rect x="30" y="27" width="22" height="22" rx="5" fill="#1a1a1a" stroke="#2f3a2f"/>
  <text x="37" y="43" fill="#00ff00" font-family="Menlo, Courier New, monospace" font-size="13" font-weight="900">B</text>
  <text x="64" y="42" fill="#e0e0e0" font-family="Menlo, Courier New, monospace" font-size="18" font-weight="700">Python Lab</text>
  <rect x="320" y="26" width="76" height="22" rx="5" fill="#0d0d0d" stroke="#2b2b2b"/>
  <text x="337" y="41" fill="#00ffcc" font-family="Menlo, Courier New, monospace" font-size="10">Pyodide</text>
  <rect x="410" y="26" width="76" height="22" rx="5" fill="#26332a" stroke="#2b2b2b"/>
  <text x="435" y="41" fill="#b8ffb8" font-family="Menlo, Courier New, monospace" font-size="10" font-weight="700">Run</text>

  <g transform="translate(28 72)">
    <rect width="230" height="28" rx="6" fill="#17252b" stroke="#00ffcc" stroke-opacity=".55"/>
    <text x="22" y="19" fill="#00ffcc" font-family="Menlo, Courier New, monospace" font-size="12" font-weight="700">Editor</text>
    <text x="92" y="19" fill="#d8ddd8" font-family="Menlo, Courier New, monospace" font-size="12">Console</text>
    <text x="170" y="19" fill="#d8ddd8" font-family="Menlo, Courier New, monospace" font-size="12">Files</text>
  </g>

  <rect x="28" y="112" width="286" height="112" rx="7" fill="#0f0f0f" stroke="#333"/>
  <text x="42" y="134" fill="#00ff00" font-family="Menlo, Courier New, monospace" font-size="11" font-weight="700">SCRIPT</text>
  <g font-family="Menlo, Courier New, monospace" font-size="10">
    <text x="42" y="158" fill="#7b8f85">1</text>
    <text x="66" y="158" fill="#00ffcc">from</text>
    <text x="100" y="158" fill="#e0e0e0"> bit_pirate </text>
    <text x="178" y="158" fill="#00ffcc">import</text>
    <text x="222" y="158" fill="#e0e0e0"> BitPirate</text>
    <text x="42" y="180" fill="#7b8f85">2</text>
    <text x="66" y="180" fill="#e0e0e0">bp = await BitPirate.connect()</text>
    <text x="42" y="202" fill="#7b8f85">3</text>
    <text x="66" y="202" fill="#00ffcc">await</text>
    <text x="106" y="202" fill="#e0e0e0"> bp.send(</text>
    <text x="160" y="202" fill="#b8ffb8">&quot;i2c scan&quot;</text>
    <text x="224" y="202" fill="#e0e0e0">)</text>
  </g>

  <rect x="326" y="112" width="166" height="112" rx="7" fill="#0f0f0f" stroke="#333"/>
  <text x="340" y="134" fill="#00ff00" font-family="Menlo, Courier New, monospace" font-size="11" font-weight="700">SERIAL</text>
  <g font-family="Menlo, Courier New, monospace" font-size="10">
    <text x="340" y="158" fill="#00ffcc">BP&gt; mode i2c</text>
    <text x="340" y="180" fill="#d8ddd8">I2C ready</text>
    <text x="340" y="202" fill="#00ffcc">BP&gt; scan</text>
    <text x="340" y="216" fill="#b8ffb8">0x3C ACK</text>
  </g>

  <path d="M302 168 C314 168 314 168 326 168" fill="none" stroke="#00ffcc" stroke-width="3" stroke-linecap="round"/>
  <path d="M318 160 L328 168 L318 176" fill="none" stroke="#00ffcc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="28" y="238" width="464" height="30" rx="6" fill="#101412" stroke="#333"/>
  <text x="42" y="257" fill="#d8ddd8" font-family="Menlo, Courier New, monospace" font-size="10">Reusable scripts · Web Serial bridge</text>
  <rect x="344" y="246" width="54" height="14" rx="4" fill="#17252b" stroke="#2b2b2b"/>
  <text x="356" y="257" fill="#d8fff2" font-family="Menlo, Courier New, monospace" font-size="9">Save</text>
  <rect x="408" y="246" width="70" height="14" rx="4" fill="#26332a" stroke="#2b2b2b"/>
  <text x="422" y="257" fill="#b8ffb8" font-family="Menlo, Courier New, monospace" font-size="9" font-weight="700">Run Lab</text>
</svg>
